services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trackstar_backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./app:/app/app
    environment:
      - DATABASE_URL=sqlite:////app/data/media_tracker.db
      - SETLIST_FM_API_KEY=${SETLIST_FM_API_KEY:-}
      - SETLIST_FM_USER_ID=${SETLIST_FM_USER_ID:-}
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - LETTERBOXD_RSS_URL=${LETTERBOXD_RSS_URL:-}
    restart: unless-stopped
