services:
  caddy:
    image: caddy:2-alpine
    container_name: trackstar_pds_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - PDS_HOSTNAME=${PDS_HOSTNAME}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - pds
    networks:
      - pds_net

  pds:
    image: ghcr.io/bluesky-social/pds:latest
    container_name: trackstar_pds
    restart: unless-stopped
    environment:
      - PDS_HOSTNAME=${PDS_HOSTNAME}
      - PDS_PORT=3000
      - PDS_PUBLIC_URL=${PDS_PUBLIC_URL:-https://${PDS_HOSTNAME}}
      - PDS_ADMIN_PASSWORD=${PDS_ADMIN_PASSWORD}
      - PDS_JWT_SECRET=${PDS_JWT_SECRET}
      - PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX=${PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX}
      - PDS_DATA_DIRECTORY=/pds
      - PDS_BLOBSTORE_DISK_LOCATION=/pds/blocks
      - PDS_BLOB_UPLOAD_LIMIT=${PDS_BLOB_UPLOAD_LIMIT:-52428800}
      - PDS_DID_PLC_URL=${PDS_DID_PLC_URL:-https://plc.directory}
      - PDS_BSKY_APP_VIEW_URL=${PDS_BSKY_APP_VIEW_URL:-https://api.bsky.app}
      - PDS_BSKY_APP_VIEW_DID=${PDS_BSKY_APP_VIEW_DID:-did:web:api.bsky.app}
      - PDS_REPORT_SERVICE_URL=${PDS_REPORT_SERVICE_URL:-https://mod.bsky.app}
      - PDS_REPORT_SERVICE_DID=${PDS_REPORT_SERVICE_DID:-did:plc:ar7c4by46qzaona2a2vptpon}
      - PDS_CRAWLERS=${PDS_CRAWLERS:-https://bsky.network}
      - PDS_INVITE_REQUIRED=${PDS_INVITE_REQUIRED:-true}
      - LOG_ENABLED=${LOG_ENABLED:-true}
    volumes:
      - ./data:/pds
    networks:
      - pds_net

volumes:
  caddy_data:
  caddy_config:

networks:
  pds_net:
    driver: bridge
