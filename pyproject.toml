[project]
name = "trackstar"
version = "0.1.0"
description = "TrackStar: AT Protocol Personal Media Tracking Client & Sync Tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "atproto>=0.0.47",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
