<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trackstar — Media Sync</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    
    <!-- Top Header -->
    <header class="header">
      <div class="brand">
        <div class="logo">t*</div>
        <div>
          <h1>Trackstar</h1>
          <p class="subtitle">PDS Media Sync</p>
        </div>
      </div>

      <div class="header-actions">
        <span id="connection-pill" class="pill disconnected">Disconnected</span>
        <button id="btn-refresh" class="icon-btn" title="Refresh PDS" aria-label="Refresh PDS">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
          </svg>
        </button>
        <button id="btn-toggle-settings" class="icon-btn" title="Settings" aria-label="Settings">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Settings View (Collapsible) -->
    <section id="settings-view" class="view hidden">
      <h2>PDS Server Configuration</h2>
      <form id="form-settings" class="form">
        <div class="form-group">
          <label for="input-pds-url">PDS Endpoint URL</label>
          <input type="url" id="input-pds-url" required placeholder="http://localhost:3000">
        </div>

        <div class="form-group">
          <label for="input-handle">Handle / DID</label>
          <input type="text" id="input-handle" required placeholder="kentrain.trackstar.test">
        </div>

        <div class="form-group">
          <label for="input-password">App Password / Password</label>
          <input type="password" id="input-password" required placeholder="••••••••••••">
        </div>

        <div class="form-actions">
          <button type="button" id="btn-preset-local" class="btn btn-secondary btn-xs">Local (:3000)</button>
          <button type="button" id="btn-preset-bsky" class="btn btn-secondary btn-xs">Bluesky</button>
        </div>

        <button type="submit" id="btn-save-settings" class="btn btn-primary btn-block">
          Connect to PDS
        </button>

        <div id="settings-error" class="error-msg hidden"></div>
      </form>
    </section>

    <!-- Primary Navigation: 2 Tabs -->
    <nav class="main-tabs">
      <button class="main-tab-btn active" data-tab="integrations">
        Integrations
      </button>
      <button class="main-tab-btn" data-tab="unsynced">
        Unsynced Items <span id="badge-unsynced-count" class="tab-badge">0</span>
      </button>
    </nav>

    <!-- Main Views Container -->
    <main id="main-view" class="view">
      
      <!-- Tab 1: Integrations Panel -->
      <section id="panel-integrations" class="tab-panel">
        <div id="integrations-list" class="integrations-list">
          <!-- Dynamically injected integration cards -->
        </div>
      </section>

      <!-- Tab 2: Unsynced Items Panel -->
      <section id="panel-unsynced" class="tab-panel hidden">
        <div id="unsynced-list" class="unsynced-list">
          <!-- Dynamically injected unsynced media cards -->
        </div>

        <!-- Unsynced Empty State -->
        <div id="unsynced-empty" class="empty-state hidden">
          <div class="empty-icon">🎉</div>
          <p class="empty-title">All Caught Up!</p>
          <p class="empty-desc">All records in your PDS are synchronized with your external platforms.</p>
        </div>
      </section>

      <!-- Loading State -->
      <div id="loading-spinner" class="loading-state hidden">
        <div class="spinner"></div>
        <p>Fetching records from PDS...</p>
      </div>

      <!-- General Empty / Disconnected State -->
      <div id="empty-state" class="empty-state hidden">
        <p class="empty-title">PDS Connection Needed</p>
        <p class="empty-desc">Connect your PDS credentials in settings to view integrations and sync status.</p>
      </div>

    </main>



  </div>

  <script src="popup.js"></script>
</body>
</html>
